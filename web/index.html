<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読書・日記メモ</title>
<style>
  :root {
    --bg: #faf8f4; --card: #fff; --ink: #2b2723; --sub: #8a8178; --line: #e8e2d8;
    --accent: #b5651d; --read: #2f6f5e; --diary: #9a4f7a; --topic: #3d6fa5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1b19; --card: #272421; --ink: #ece7df; --sub: #9b928a; --line: #3a3631; --accent: #e0954f; --read: #5fb59d; --diary: #d98cb9; --topic: #6fa3d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
  header { position: sticky; top: 0; background: var(--bg); padding: 12px 0 8px; z-index: 5; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .bar h1 { font-size: 18px; margin: 0 auto 0 0; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: #c0392b; }
  button:disabled { opacity: .5; }
  input[type=text], input[type=email], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 42vh; resize: vertical; line-height: 1.8; }
  .search { margin-top: 8px; }
  .chips { display: flex; gap: 6px; margin-top: 8px; }
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .item { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .item .meta { font-size: 13px; color: var(--sub); display: flex; gap: 8px; align-items: center; }
  .item .t { font-weight: 600; margin: 2px 0; overflow-wrap: anywhere; }
  .item .s { color: var(--sub); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 0 8px; border-radius: 999px; color: #fff; }
  .badge.read { background: var(--read); } .badge.diary { background: var(--diary); } .badge.topic { background: var(--topic); }
  .empty, .msg { color: var(--sub); text-align: center; padding: 32px 0; }
  .fab { position: fixed; right: 20px; bottom: 24px; border-radius: 999px; padding: 14px 22px; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 6; }
  /* editor */
  #editor { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; display: none; }
  #editor.open { display: block; }
  .row { margin: 12px 0; }
  .seg { display: flex; gap: 6px; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .att { position: relative; width: 96px; height: 96px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 12px; text-align: center; padding: 4px; color: var(--sub); cursor: pointer; }
  .att img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .att .x { position: absolute; top: 2px; right: 2px; z-index: 2; width: 24px; height: 24px; padding: 0; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; border: 0; line-height: 24px; }
  .hint { font-size: 13px; color: var(--sub); }
  .foot { display: flex; gap: 8px; margin-top: 16px; }
  .foot .sp { margin-left: auto; }
  #login { max-width: 420px; margin: 20vh auto; padding: 0 16px; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; display: none; z-index: 20; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>読書・日記メモ</h1>
  <p class="hint">登録済みのメールアドレスに、ログイン用のリンクを送ります。</p>
  <input type="email" id="email" placeholder="メールアドレス" autocomplete="email">
  <div class="row"><button class="primary" id="sendLink">ログインリンクを送る</button></div>
  <p id="loginMsg" class="hint"></p>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="bar">
      <h1>読書・日記メモ</h1>
      <button id="export" class="hidden" title="メモをMarkdownにして content/メモ/ へ書き出す">💾 ゾフィー用に書き出す</button>
      <button id="logout" class="hidden">ログアウト</button>
    </div>
    <input type="text" class="search" id="q" placeholder="タイトル・本文を検索">
    <div class="chips">
      <button class="chip on" data-k="">すべて</button>
      <button class="chip" data-k="read">読書</button>
      <button class="chip" data-k="diary">日記</button>
      <button class="chip" data-k="topic">トピック</button>
    </div>
  </header>
  <div id="list"></div>
  <button class="primary fab" id="new">＋ 書く</button>
</div>

<div id="editor">
  <div class="wrap">
    <div class="bar" style="padding:12px 0">
      <button id="back">← 戻る</button>
      <span class="hint" id="state" style="margin-left:auto"></span>
    </div>
    <div class="row seg" id="kindSeg">
      <button data-k="read" class="on">読書</button>
      <button data-k="diary">日記</button>
      <button data-k="topic">トピック</button>
    </div>
    <div class="row" id="bookRow"><input type="text" id="book" placeholder="書名（わかれば）"></div>
    <div class="row"><input type="text" id="title" placeholder="タイトル（空なら本文の1行目）"></div>
    <div class="row"><textarea id="body" placeholder="思ったことをそのまま。音声入力はキーボードのマイクで。"></textarea></div>
    <div class="row">
      <input type="file" id="shot" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="pick" accept="image/*,application/pdf" multiple class="hidden">
      <button id="btnShot">📷 写真を撮る</button>
      <button id="btnPick">📎 写真・PDFを選ぶ</button>
      <div class="atts" id="atts"></div>
    </div>
    <div class="foot">
      <button class="primary" id="save">保存</button>
      <button class="danger sp hidden" id="del">削除</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const KIND = { read: "読書", diary: "日記", topic: "トピック" };
let memos = [], filterKind = "", cur = null, newPaths = [], removedPaths = [];
// 新規メモの初期の種類: 絞り込み中ならその種類、なければ前回使った種類
const lastKind = () => { let k = ""; try { k = localStorage.getItem("memo-app-kind") || ""; } catch {} return KIND[filterKind] ? filterKind : (KIND[k] ? k : "read"); };

const toast = (t) => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = "none", 2200); };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const autoTitle = (m) => m.title.trim() || m.body.trim().split("\n")[0].slice(0, 40) || (m.book ? `『${m.book}』` : "（無題）");

// ---------- 一覧 ----------
function render() {
  const q = $("#q").value.trim().toLowerCase();
  const rows = memos.filter((m) => (!filterKind || m.kind === filterKind) &&
    (!q || (m.title + "\n" + m.book + "\n" + m.body).toLowerCase().includes(q)));
  $("#list").innerHTML = rows.length ? rows.map((m) => `
    <button class="item" data-id="${m.id}">
      <div class="meta"><span class="badge ${m.kind}">${KIND[m.kind] || m.kind}</span>${fmt(m.created_at)}
        ${m.book ? "・『" + esc(m.book) + "』" : ""}${(m.attachments || []).length ? " 📎" + m.attachments.length : ""}</div>
      <div class="t">${esc(autoTitle(m))}</div>
      <div class="s">${esc(m.body.trim().split("\n").slice(m.title.trim() ? 0 : 1).join(" "))}</div>
    </button>`).join("") : `<div class="empty">${memos.length ? "見つかりませんでした" : "まだメモがありません。「＋ 書く」から。"}</div>`;
}
$("#q").oninput = render;
document.querySelectorAll(".chip").forEach((b) => b.onclick = () => {
  filterKind = b.dataset.k;
  document.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
$("#list").onclick = (e) => {
  const it = e.target.closest(".item"); if (it) openEditor(memos.find((m) => m.id === it.dataset.id));
};
async function reload() {
  try { memos = await store.list(); render(); }
  catch (e) { $("#list").innerHTML = `<div class="msg">読み込めませんでした: ${esc(e.message || String(e))}<br>（Supabaseで schema.sql を実行済みか確認）</div>`; }
}

// ---------- 編集 ----------
const DRAFT = "memo-app-draft";
let kind = "read";
function setKind(k) {
  kind = k;
  document.querySelectorAll("#kindSeg button").forEach((b) => b.classList.toggle("on", b.dataset.k === k));
  $("#bookRow").classList.toggle("hidden", k !== "read");
}
document.querySelectorAll("#kindSeg button").forEach((b) => b.onclick = () => { setKind(b.dataset.k); saveDraft(); });

function openEditor(m) {
  newPaths = []; removedPaths = [];
  if (m) cur = JSON.parse(JSON.stringify(m));
  else {
    let d = null; try { d = JSON.parse(localStorage.getItem(DRAFT) || "null"); } catch {}
    cur = d && d.id ? d : { id: crypto.randomUUID(), kind: lastKind(), title: "", book: "", body: "", attachments: [], created_at: new Date().toISOString() };
    cur._isNew = true;
  }
  setKind(cur.kind);
  $("#title").value = cur.title; $("#book").value = cur.book; $("#body").value = cur.body;
  $("#del").classList.toggle("hidden", !m);
  $("#state").textContent = m ? fmt(cur.created_at) : "新規";
  renderAtts();
  $("#editor").classList.add("open"); $("#editor").scrollTop = 0;
  if (!m) $("#body").focus();
}
function collect() {
  cur.kind = kind; cur.title = $("#title").value; cur.book = $("#book").value; cur.body = $("#body").value;
  return cur;
}
function saveDraft() {
  if (!cur || !cur._isNew) return;
  try { localStorage.setItem(DRAFT, JSON.stringify(collect())); } catch {}
}
["#title", "#book", "#body"].forEach((s) => $(s).addEventListener("input", saveDraft));

async function renderAtts() {
  const box = $("#atts"); box.innerHTML = "";
  for (const a of cur.attachments) {
    const d = document.createElement("div"); d.className = "att";
    const isImg = (a.type || "").startsWith("image/");
    d.innerHTML = `<button class="x" title="外す">×</button>` + (isImg ? "" : esc(a.name));
    d.querySelector(".x").onclick = (e) => {
      e.stopPropagation();
      cur.attachments = cur.attachments.filter((x) => x.path !== a.path);
      if (newPaths.includes(a.path)) { newPaths = newPaths.filter((p) => p !== a.path); store.removeFiles([a.path]); }
      else removedPaths.push(a.path);
      renderAtts(); saveDraft();
    };
    d.onclick = async () => { try { window.open(await store.fileUrl(a.path), "_blank"); } catch (e) { toast("開けませんでした"); } };
    box.appendChild(d);
    if (isImg) store.fileUrl(a.path).then((u) => { const im = document.createElement("img"); im.src = u; d.prepend(im); }).catch(() => {});
  }
}
// 大きな写真は長辺1600pxのJPEGに縮めて保存（スマホ写真の数MBを数百KBに）
async function shrink(file) {
  if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    if (!blob) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch { return file; }
}
async function addFiles(files) {
  if (!files.length) return;
  $("#state").textContent = "アップロード中…"; $("#save").disabled = true;
  const target = cur;
  for (const f of files) {
    try {
      const up = await store.uploadFile(await shrink(f));
      target.attachments.push(up); newPaths.push(up.path);
    } catch (e) { toast("追加できませんでした: " + (e.message || e)); }
  }
  $("#save").disabled = false;
  $("#state").textContent = cur._isNew ? "新規" : fmt(cur.created_at);
  renderAtts(); saveDraft();
}
$("#btnShot").onclick = () => $("#shot").click();
$("#btnPick").onclick = () => $("#pick").click();
$("#shot").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
$("#pick").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };

function closeEditor() { $("#editor").classList.remove("open"); cur = null; }
$("#back").onclick = async () => {
  if (cur && cur._isNew) saveDraft();
  else if (newPaths.length) await store.removeFiles(newPaths); // 保存せず戻ったときの、追加済みファイルの後始末
  closeEditor();
};
$("#new").onclick = () => openEditor(null);
$("#save").onclick = async () => {
  collect();
  if (!cur.body.trim() && !cur.title.trim() && !cur.attachments.length) { toast("何か書いてください"); return; }
  cur.title = autoTitle(cur) === "（無題）" ? "" : cur.title;
  const row = { ...cur }; delete row._isNew;
  $("#save").disabled = true;
  try {
    await store.save(row);
    try { localStorage.setItem("memo-app-kind", row.kind); } catch {}
    if (removedPaths.length) await store.removeFiles(removedPaths);
    if (cur._isNew) localStorage.removeItem(DRAFT);
    newPaths = []; removedPaths = [];
    closeEditor(); toast("保存しました"); await reload();
  } catch (e) { toast("保存に失敗: " + (e.message || e)); }
  $("#save").disabled = false;
};
$("#del").onclick = async () => {
  if (!confirm("このメモと添付ファイルを削除します。よいですか？")) return;
  try { await store.remove(cur); closeEditor(); toast("削除しました"); await reload(); }
  catch (e) { toast("削除に失敗: " + (e.message || e)); }
};

// ---------- ゾフィー用の書き出し（PCのChrome/Edgeのみ）----------
// 選んだフォルダ（content/メモ/）に、1メモ=1つのMarkdown＋files/（写真・PDF）＋INDEX.md を書く。
// ファイル名は「日付_IDの先頭8桁.md」で固定（タイトルを直しても増えない）。削除したメモのファイルは消さない。
const EXPORT_DIR = "メモ";
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open("memo-app", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const kvGet = async (k) => { const db = await idb(); return new Promise((res) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); };
const kvPut = async (k, v) => { const db = await idb(); return new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = res; }); };
async function writeText(dir, name, text) {
  const w = await (await dir.getFileHandle(name, { create: true })).createWritable(); await w.write(text); await w.close();
}
async function exists(dir, name) { try { await dir.getFileHandle(name); return true; } catch { return false; } }
const baseName = (p) => p.split("/").pop();
const memoFile = (m) => `${fmt(m.created_at)}_${m.id.slice(0, 8)}.md`;
function memoToMd(m) {
  const kindJa = KIND[m.kind] || m.kind;
  const atts = (m.attachments || []).map((a) => {
    const f = "files/" + baseName(a.path);
    return (a.type || "").startsWith("image/") ? `- ![${a.name}](${f})` : `- [${a.name}](${f})`;
  });
  return ["---", `id: ${m.id}`, `kind: ${kindJa}`, `book: ${JSON.stringify(m.book || "")}`,
    `date: ${fmt(m.created_at)}`, `updated: ${m.updated_at}`, "---", "", `# ${autoTitle(m)}`, "",
    m.body.trim(), ...(atts.length ? ["", "## 添付", ...atts] : []), ""].join("\n");
}
async function exportAll(dir, items, getUrl) {
  const filesDir = await dir.getDirectoryHandle("files", { create: true });
  let nFiles = 0;
  for (const m of items) {
    await writeText(dir, memoFile(m), memoToMd(m));
    for (const a of m.attachments || []) {
      const n = baseName(a.path);
      if (await exists(filesDir, n)) continue;
      const blob = await (await fetch(await getUrl(a.path))).blob();
      const w = await (await filesDir.getFileHandle(n, { create: true })).createWritable(); await w.write(blob); await w.close();
      nFiles++;
    }
  }
  const cell = (s) => String(s).replace(/\|/g, "／").replace(/\n/g, " ");
  const idx = ["# メモ 索引（自動生成・上書きされます）", "",
    "> 読書・日記メモアプリからの書き出し。直接編集しない（アプリで直して、もう一度書き出す）。", "",
    "| 日付 | 種類 | タイトル | 書名 | ファイル |", "|---|---|---|---|---|",
    ...items.map((m) => `| ${fmt(m.created_at)} | ${KIND[m.kind] || m.kind} | ${cell(autoTitle(m))} | ${cell(m.book || "")} | [${memoFile(m)}](${memoFile(m)}) |`), ""];
  await writeText(dir, "INDEX.md", idx.join("\n"));
  return { memos: items.length, files: nFiles };
}
$("#export").onclick = async () => {
  const btn = $("#export"); btn.disabled = true;
  try {
    let dir = await kvGet("exportDir");
    if (dir && (dir.name !== EXPORT_DIR || (await dir.requestPermission({ mode: "readwrite" })) !== "granted")) dir = null;
    if (!dir) {
      toast(`書き出し先に「${EXPORT_DIR}」フォルダ（content/${EXPORT_DIR}）を選んでください`);
      dir = await window.showDirectoryPicker({ mode: "readwrite" });
      // 既存のノートを上書きしないための安全装置: フォルダ名と、INDEX.md が書き出し由来かを確認する
      if (dir.name !== EXPORT_DIR) { toast(`「${dir.name}」ではなく「${EXPORT_DIR}」を選んでください。何も書いていません`); btn.disabled = false; return; }
      try {
        const t = await (await (await dir.getFileHandle("INDEX.md")).getFile()).text();
        if (!t.includes("自動生成")) { toast("このフォルダの INDEX.md は書き出し用ではありません。何も書いていません"); btn.disabled = false; return; }
      } catch {}
      await kvPut("exportDir", dir);
    }
    await reload();
    const r = await exportAll(dir, memos, (p) => store.fileUrl(p));
    toast(`書き出しました（メモ${r.memos}件・新しい添付${r.files}件）`);
  } catch (e) { if (e.name !== "AbortError") toast("書き出せませんでした: " + (e.message || e)); }
  btn.disabled = false;
};

// ---------- 起動 ----------
(async function () {
  try {
    const r = await store.init();
    if (r.needLogin) {
      $("#login").classList.remove("hidden");
      $("#sendLink").onclick = async () => {
        const email = $("#email").value.trim(); if (!email) return;
        try { await store.sendLoginLink(email); $("#loginMsg").textContent = "送りました。メールのリンクを、このブラウザで開いてください。"; }
        catch (e) { $("#loginMsg").textContent = "送れませんでした: " + (e.message || e); }
      };
      return;
    }
  } catch (e) { document.body.innerHTML = `<p class="msg">起動できませんでした: ${esc(e.message || String(e))}</p>`; return; }
  $("#app").classList.remove("hidden");
  if (store.mode === "cloud") { $("#logout").classList.remove("hidden"); $("#logout").onclick = () => store.logout(); }
  if (window.showDirectoryPicker) $("#export").classList.remove("hidden");
  else document.title = "読書・日記メモ（お試し版）";
  await reload();
})();
</script>
</body>
</html>
